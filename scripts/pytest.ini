# The tests of this directory's scripts (release, wheel, pyflakes and vocabulary
# gates, layering, core alone, and the test inventory's reconciliation). They
# read the checkout around them, so they run here,
# from `check.sh --core` and `scripts/ci_core.sh`, and never in core's own suite,
# which A2 runs from a copy against the installed wheels (`core_alone.sh`).
[pytest]
testpaths = tests inventory
