# The form behind Help → Report a Bug… (desktop/main/report-bug.ts), which opens
# it with `version` filled in from the query string. GitHub enforces only the
# title and the fields marked required, and there is no title prefix, so the
# reporter writes the whole title; the screenshot limit and "no video" are
# requests in the form's own words, which GitHub cannot check.
# desktop/tests/report-bug.test.mts reads this file's shape.
name: Bug report
description: Something in Delphi broke, or did not do what it should.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. A title and a brief description are enough; the rest helps when you have it.

        In Delphi, **Help → Report a Bug…** copies the diagnostics to your clipboard and opens this form with the version filled in.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of bug?
      description: The part of Delphi where it happened.
      options:
        - Installing or launching Delphi
        - The reader (PDFs, web pages)
        - Memory
        - Chat
        - Plan mode or MCP
        - Settings or sign-in
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: A brief description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. How to make it happen again, if you know.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach up to 2 screenshots (PNG or JPG). Please no video.
      placeholder: Drag screenshots here, or paste them.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Delphi, choose Help → Copy Diagnostics and paste the result here; Help → Report a Bug… has already put it on your clipboard. Keys, tokens, email addresses and your user name are taken out, but read it over before you submit.
      render: text
  - type: input
    id: version
    attributes:
      label: Delphi version
      description: Filled in when you start from Help → Report a Bug…; otherwise Delphi → About Delphi shows it.
      placeholder: 0.1.0
